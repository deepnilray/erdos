name: giant-impacts
on:
  push:
    branches: [claude/winter-2026-plan]
    paths: ["winter2026/03_frontier/giant_impacts/*.py", "winter2026/03_frontier/giant_impacts/RUN", ".github/workflows/giant_impacts.yml"]
  workflow_dispatch:
concurrency:
  group: giant-impacts
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install numpy scipy astropy pyvo pandas matplotlib requests
      - name: restore state
        working-directory: winter2026/03_frontier/giant_impacts
        run: |
          mkdir -p results
          if git ls-remote --exit-code origin impacts-live >/dev/null 2>&1; then
            git fetch -q --depth 1 origin impacts-live
            git archive FETCH_HEAD | tar -x -C results && echo restored
          fi
          ls results | head; wc -l results/scores.csv 2>/dev/null || true
      - name: run with live publishing every 8 minutes
        working-directory: winter2026/03_frontier/giant_impacts
        run: |
          ( while true; do sleep 480; ./publish.sh "$GITHUB_REPOSITORY" "${{ secrets.GITHUB_TOKEN }}"; done ) &
          CMD=$(cat RUN); echo "running: $CMD"; bash -c "$CMD" || true
      - name: final publish
        if: always()
        working-directory: winter2026/03_frontier/giant_impacts
        run: ./publish.sh "$GITHUB_REPOSITORY" "${{ secrets.GITHUB_TOKEN }}"
