name: giant-impacts
on:
  push:
    branches: [claude/winter-2026-plan]
    paths: ["winter2026/03_frontier/giant_impacts/*.py", "winter2026/03_frontier/giant_impacts/RUN", ".github/workflows/giant_impacts.yml"]
  workflow_dispatch:
concurrency:
  group: giant-impacts
  cancel-in-progress: true
permissions:
  contents: write
  actions: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    env:
      SHARD: ${{ matrix.shard }}
      NSHARDS: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install numpy scipy astropy pyvo pandas matplotlib requests
      - name: restore state
        working-directory: winter2026/03_frontier/giant_impacts
        run: |
          mkdir -p results
          if git clone -q --depth 1 --branch impacts-live-$SHARD "https://github.com/${GITHUB_REPOSITORY}.git" /tmp/prev; then
            rm -rf /tmp/prev/.git && cp -r /tmp/prev/* results/ && echo "restored shard $SHARD"
          else echo "no previous state for shard $SHARD"; fi
          X=$((SHARD+4))
          if git clone -q --depth 1 --branch impacts-live-$X "https://github.com/${GITHUB_REPOSITORY}.git" /tmp/prevx; then
            tail -n +2 /tmp/prevx/scores.csv >> results/scores.csv; cp -r /tmp/prevx/lc/* results/lc/ 2>/dev/null || true
            echo "merged state of former shard $X"; fi
          wc -l results/scores.csv 2>/dev/null || true
      - name: run with live publishing every 8 minutes
        working-directory: winter2026/03_frontier/giant_impacts
        run: |
          ( while true; do sleep 480; ./publish.sh "$GITHUB_REPOSITORY" "${{ secrets.GITHUB_TOKEN }}"; done ) &
          CMD=$(cat RUN); echo "running: $CMD"; bash -c "$CMD" || true
      - name: final publish
        if: always()
        working-directory: winter2026/03_frontier/giant_impacts
        run: ./publish.sh "$GITHUB_REPOSITORY" "${{ secrets.GITHUB_TOKEN }}"
      - name: relaunch if this shard is unfinished (shard 0 dispatches for all)
        if: always() && matrix.shard == 0
        working-directory: winter2026/03_frontier/giant_impacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          R=$(cat results/REMAINING 2>/dev/null || echo 1)
          echo "remaining: $R"
          if [ "$R" -gt 0 ]; then
            curl -s -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/giant_impacts.yml/dispatches" \
              -d "{\"ref\":\"${GITHUB_REF_NAME}\"}" && echo "relaunched"
          fi
